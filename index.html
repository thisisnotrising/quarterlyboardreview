<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================================
  ARCHIVE HOMEPAGE — the front door of the site.
  It draws its cards from reports.js. You never edit this file to add a report;
  you add one entry to reports.js (see the comments there).
====================================================================== -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>NOT RISING · Quarterly Board Review</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:ital,wght@0,300;0,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archive.css">
</head>
<body>

<!-- Banner first, then straight to the latest report. -->
<img class="banner" src="images/human-curators-banner.jpg" alt="Meet the Human Curators">
<h1 class="sr-only" id="title"></h1>

<div class="label">LATEST REPORT</div>
<div class="wrap latest" id="latest"></div>

<div class="label" id="archive-label">ARCHIVE</div>
<div class="wrap list" id="archive"></div>

<!-- About: photo on the left, description on the right (stacks on a phone). The photo already says "ABOUT". -->
<div class="about">
  <img src="images/about-kathi.jpg" alt="About NOT RISING: Kathi Dalguntas, Founder and Editor-in-Chief">
  <div class="about-text">
    <p id="intro"></p>
    <p class="about-links"><a href="https://thisisnotrising.org">thisisnotrising.org</a></p>
  </div>
</div>

<div class="foot">Each report is a frozen, self-contained snapshot: its own numbers, its own code, its own images. Older reports never change when a new one is added.</div>

<script src="reports.js"></script>
<script>
/* Reads window.BOARD_REPORTS (from reports.js), sorts newest first, and writes the cards. */
(function () {
  "use strict";
  const A = window.BOARD_ARCHIVE, list = (window.BOARD_REPORTS || []).slice();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmtDate = iso => new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  const comma = n => Number(n).toLocaleString("en-US");

  document.getElementById("title").textContent = A.title;
  document.getElementById("intro").textContent = A.intro;

  list.sort((a, b) => (a.asOf < b.asOf ? 1 : a.asOf > b.asOf ? -1 : 0));      // newest first
  const href = r => "reports/" + encodeURIComponent(r.id) + "/index.html";
  const meta = r => '<div class="card-meta"><span class="status' + (r.status === "Final" ? "" : " open") + '">' + esc(r.status).toUpperCase() + "</span>" +
                    "<span>AS OF <b>" + fmtDate(r.asOf) + "</b></span><span><b>" + comma(r.subscribers) + "</b> SUBSCRIBERS</span></div>";

  if (!list.length) {
    document.getElementById("latest").innerHTML = "<p class='intro'>No reports yet. Add one to reports.js.</p>";
    document.getElementById("archive-label").style.display = "none";
    return;
  }
  const [latest, ...older] = list;
  document.getElementById("latest").innerHTML =
    '<a class="card" href="' + href(latest) + '"><div class="card-name">' + esc(latest.label) + '</div><div class="card-season">' + esc(latest.season) + "</div>" +
    meta(latest) + '<div class="open-cta">OPEN REPORT →</div></a>';

  if (!older.length) document.getElementById("archive-label").style.display = "none";
  document.getElementById("archive").innerHTML = older.map(r =>
    '<a class="card" href="' + href(r) + '"><div><div class="card-name">' + esc(r.label) + '</div><div class="card-season">' + esc(r.season) + "</div></div>" + meta(r) + "</a>").join("");
})();
</script>
</body>
</html>
